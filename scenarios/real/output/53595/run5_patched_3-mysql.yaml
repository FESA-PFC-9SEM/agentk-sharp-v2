apiVersion: v1
kind: Pod
metadata:
  labels:
    name: mysql
  name: mysql
  namespace: custom-namespace
spec:
  containers:
  - args:
    - --ignore-db-dir
    - lost+found
    env:
    - name: MYSQL_ROOT_PASSWORD
      value: mypassowrd 123
    - name: MYSQL_USER
      value: admin
    - valueFrom:
        secretKeyRef:
          key: mysql-password
          name: mysql-credentials
    image: mysql:latest@sha256:<digest>
    livenessProbe:
      httpGet:
        path: /health
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 10
    name: mysql
    ports:
    - containerPort: 3306
      name: mysql
    readinessProbe:
      httpGet:
        path: /health
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
    resources:
      limits:
        cpu: 1.0
        memory: 256Mi
      requests:
        cpu: 0.3
        memory: 512Mi
    volumeMounts:
    - mountPath: /var/lib/mysql
      name: mysql-persistent-storage
  securityContext:
    runAsGroup: 3000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: docker/default
  template:
    spec:
      automountServiceAccountToken: false
  volumes:
  - persistentVolumeClaim:
      claimName: mysql-pvc
---
apiVersion: v1
data:
  mysql-password: aGFyZGNvZGVkLW15c3FsLXBhc3MtMjAyNA==
kind: Secret
metadata:
  name: mysql-credentials
type: Opaque
