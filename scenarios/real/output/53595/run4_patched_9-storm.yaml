apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: storm-worker
  name: storm-worker-controller
  namespace: storm-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      name: storm-worker
      uses: nimbus
  template:
    metadata:
      labels:
        name: storm-worker
        uses: nimbus
    spec:
      containers:
      - args:
        - echo 'Worker stub iniciado...'; while true; do sleep 3600; done
        command:
        - /bin/sh
        - -c
        env:
        - name: STORM_NIMBUS_PASSWORD
          value: storm-admin-123
        - name: STORM_NIMBUS
          value: nimbus.default.svc.cluster.local
        - name: STORM_ZOOKEEPER_SERVERS
          value: zookeeper.default.svc.cluster.local:2181
        image: nginx@sha256:digest
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        name: storm-worker
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 3000
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
