apiVersion: v1
kind: Pod
metadata:
  labels:
    name:
      app: mysql
  name: mysql
  namespace: custom-namespace
spec:
  containers:
  - args:
    - --ignore-db-dir
    - lost+found
    env:
    - name: MYSQL_ROOT_PASSWORD
      value: mypassowrd 123
    - name: MYSQL_USER
      value: admin
    - name: MYSQL_PASSWORD
      value:
        valueFrom:
          secretKeyRef:
            key: mysql-password
            name: mysql-credentials
    image: mysql:latest@sha256:<digest>
    livenessProbe:
      httpGet:
        path: /health
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 10
    name: mysql
    ports:
    - containerPort: 3306
      name: mysql
    readinessProbe:
      httpGet:
        path: /health
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
    resources:
      limits:
        cpu: 0.5
        memory: 1Gi
      requests:
        cpu: 0.5
        memory: 512Mi
    volumeMounts:
    - mountPath: /var/lib/mysql
      name: mysql-persistent-storage
  securityContext:
    runAsGroup: 3000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: docker/default
  template:
    spec:
      automountServiceAccountToken: false
  volumes:
  - cinder:
      fsType: ext4
      volumeID: bd82f7e2-wece-4c01-a505-4acf60b07f4a
    name: mysql-persistent-storage
---
apiVersion: v1
data:
  mysql-password: aGFyZGNvZGVkLW15c3FsLXBhc3MtMjAyNA==
kind: Secret
metadata:
  name: mysql-credentials
type: Opaque
