apiVersion: v1
kind: Service
metadata:
  labels:
    component: elasticsearch
  name: elasticsearch
  namespace: custom-namespace
spec:
  ports:
  - name: http
    port: 9200
    protocol: TCP
  selector:
    app: elasticsearch
  type: LoadBalancer
---
apiVersion: v1
kind: ReplicationController
metadata:
  labels:
    component: elasticsearch
  name: es
  namespace: custom-namespace
spec:
  replicas: 3
  template:
    metadata:
      labels:
        component: elasticsearch
    spec:
      containers:
      - env:
        - name: KUBERNETES_CA_CERTIFICATE_FILE
          value: /variavel/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CLUSTER_NAME
          value: myesdb
        - name: DISCOVERY_SERVICE
          value: elasticsearch
        - name: NODE_MASTER
          value: 'true'
        - name: NODE_DATA
          value: 'true'
        - name: HTTP_ENABLE
          value: 'true'
        - name: ELASTIC_PASSWORD
          value: elastic123admin
        - name: KIBANA_PASSWORD
          value: kibana-secret-pass
        image: nginx:1.21@sha256:<digest>
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - echo hello
          initialDelaySeconds: 30
          periodSeconds: 10
        name: es
        ports:
        - containerPort: 9200
          name: http
          protocol: TCP
        - containerPort: 9300
          name: transport
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - NET_RAW
        volumeMounts:
        - mountPath: /data
          name: storage
      initContainers:
      - command:
        - sysctl
        - -w
        - vm.max_map_count=262144
        image: busybox
        imagePullPolicy: IfNotPresent
        name: init-sysctl
        securityContext: {}
      serviceAccount: elasticsearch
      volumes:
      - emptyDir:
          sizeLimit: 215Mi
        name: storage
