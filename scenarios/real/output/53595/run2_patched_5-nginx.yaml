apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx
  name: nginxsvc
  namespace: custom-namespace
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
  - name: https
    port: 443
    protocol: TCP
    tls:
      certificate: <base64-encoded-certificate>
      key: <base64-encoded-key>
  selector:
    app: nginxs
  type: NodePort
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: my-nginx
  namespace: custom-namespace
spec:
  replicas:
    replicas: 3
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - command:
        - /hom/auto-reload-nginx.sh
        env:
        - name: SSL_CERT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: ssl-cert-password
              name: nginxsecret
        - name: DB_CONNECTION
          valueFrom:
            secretKeyRef:
              key: db-connection
              name: my-db-secret
        image: nginx@sha256:digest
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 30
          timeoutSeconds: 30
        name: nginxhttps
        ports:
        - containerPort: 443
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/nginx/ssl
          name: secret-volume
        - mountPath: /etc/nginx/conf.d
          name: configmap-volume
      securityContext:
        seccompProfile:
          type: docker/default
      volumes:
      - name: secret-volume
        secret:
          secretName: nginxsecret
      - configMap:
          name: nginxconfigmap
        name: configmap-volume
