apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: non-default-namespace
spec:
  ports:
  - name: mongodb
    port: 27017
    protocol: TCP
    targetPort: 27017
  selector:
    app: mongodb
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  namespace: custom-namespace
spec:
  replicas:
    replicas: 3
  selector:
    matchLabels:
      app: mongodb-app
  template:
    metadata:
      labels:
        app: mongodb-app
    spec:
      containers:
      - automountServiceAccountToken: false
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: mongodb-secret
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: mongodb-secret
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: mongodb-credentials
        image: mongo:latest@sha256:<digest>
        livenessProbe:
          httpGet:
            path: /health
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 10
        name: mongodb-container
        ports:
        - containerPort: 27017
        readinessProbe:
          httpGet:
            path: /health
            port: 28017
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /data/db
          name: mongo-storage
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: mongo-storage
