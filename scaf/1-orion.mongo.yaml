---
apiVersion: v1
kind: Secret
metadata:
  name: orionld-mongodb-secret
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "usuariozao"
  MONGO_INITDB_ROOT_PASSWORD: "123456789"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orionld-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orionld-mongodb
  template:
    metadata:
      labels:
        app: orionld-mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: orionld-mongodb-secret
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orionld-mongodb-secret
              key: MONGO_INITDB_ROOT_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: orionld-mongodb-svc
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: orionld-mongodb